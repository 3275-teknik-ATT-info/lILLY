<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lILLY — Neon Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: #e0f7ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #00f0ff, #ff00aa, #7000ff, #00f0ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 50px rgba(0, 240, 255, 0.45);
      margin-bottom: 0.8rem;
      animation: gradientShift 6s ease infinite, glow 3s ease-in-out infinite alternate;
    }
    .subtitle {
      font-size: 1.15rem;
      color: #a0d8ff;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0.85;
    }
    p {
      font-size: 1.15rem;
      color: #b8e4ff;
      max-width: 480px;
      line-height: 1.65;
      opacity: 0.9;
      margin-bottom: 2.8rem;
    }
    .btn {
      pointer-events: auto;
      display: inline-block;
      padding: 0.95rem 2.6rem;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.08em;
      border-radius: 3px;
      background: rgba(0, 240, 255, 0.07);
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
    }
    .btn:hover {
      background: #00f0ff;
      color: #050510;
      box-shadow: 0 0 45px rgba(0, 240, 255, 0.8);
      transform: translateY(-2px);
    }
    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.13) 2px,
        rgba(0,0,0,0.13) 4px
      );
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="content">
    <h1>lILLY</h1>
    <div class="subtitle">Neon Horizon</div>
    <p>Astro-inspired retro experience powered by Three.js.<br>Built on Android with GitHub Actions.</p>
    <a href="#" class="btn">ENTER THE GRID</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.0026);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Bloom (single clean pass)
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.5, 0.4, 0.85
    );
    composer.addPass(bloomPass);

    // Minimal neon grid + particles (placeholder geometry)
    const gridHelper = new THREE.GridHelper(200, 40, 0x00f0ff, 0x003344);
    gridHelper.position.y = -10;
    scene.add(gridHelper);

    const particles = new THREE.BufferGeometry();
    const count = 800;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 120;
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.35, transparent: true, opacity: 0.7 });
    const points = new THREE.Points(particles, particleMat);
    scene.add(points);

    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.0008;
      gridHelper.rotation.y += 0.0003;
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
