<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>lILLY — Neon Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: #e0f7ff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      touch-action: none;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 0; }
    .content {
      position: relative;
      z-index: 20;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .content.hidden { opacity: 0; pointer-events: none; }
    h1 {
      font-size: clamp(2.8rem, 9vw, 5.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #00f0ff, #ff00aa, #7000ff, #00f0ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 50px rgba(0, 240, 255, 0.45);
      margin-bottom: 0.5rem;
      animation: gradientShift 6s ease infinite, glow 3s ease-in-out infinite alternate;
    }
    .subtitle {
      font-size: 1rem;
      color: #a0d8ff;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
      opacity: 0.85;
    }
    p {
      font-size: 1.05rem;
      color: #b8e4ff;
      max-width: 420px;
      line-height: 1.55;
      opacity: 0.9;
      margin-bottom: 2.5rem;
    }
    .btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.6rem;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.1em;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
      z-index: 30;
      cursor: pointer;
    }
    .btn:hover, .btn:active {
      background: #00f0ff;
      color: #050510;
      transform: scale(1.08);
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.95);
    }
    .social-orbit {
      position: absolute;
      width: 260px;
      height: 260px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
    }
    .social-icon {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      pointer-events: auto;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
      background: rgba(8, 12, 28, 0.9);
      border: 1.5px solid #00f0ff;
      backdrop-filter: blur(4px);
    }
    .social-icon:hover {
      transform: scale(1.22);
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.9);
    }
    .social-icon.linkedin { border-color: #0a66c2; color: #0a66c2; }
    .social-icon.instagram { border-color: #e1306c; color: #e1306c; }
    .social-icon.paypal { border-color: #0070ba; color: #0070ba; }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.28); }
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
      );
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="content" id="ui">
    <h1>lILLY</h1>
    <div class="subtitle">Neon Horizon</div>
    <p>Astro-inspired retro experience powered by Three.js.<br>Built on Android with GitHub Actions.</p>

    <div class="social-orbit" id="socialOrbit">
      <a href="https://www.linkedin.com" target="_blank" rel="noopener" class="social-icon linkedin">in</a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener" class="social-icon instagram">ig</a>
      <a href="https://www.paypal.com" target="_blank" rel="noopener" class="social-icon paypal">$</a>
    </div>

    <button class="btn" id="enterBtn">ENTER THE GRID</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ========== CORE SETUP ==========
    const container = document.getElementById('canvas-container');
    const ui = document.getElementById('ui');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.0022);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);
    camera.position.set(0, 6, 32);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.4, 0.85);
    composer.addPass(bloomPass);

    // ========== GRID ==========
    const grid = new THREE.GridHelper(140, 70, 0x00f0ff, 0x16002a);
    grid.position.y = -2;
    scene.add(grid);

    // ========== SHAPES ==========
    const shapes = [];
    const colors = [0x00f0ff, 0xff00aa, 0x7000ff, 0x00ff88, 0xff55ff];
    for (let i = 0; i < 24; i++) {
      let geo;
      const t = i % 4;
      if (t === 0) geo = new THREE.IcosahedronGeometry(0.9 + Math.random() * 0.7, 0);
      else if (t === 1) geo = new THREE.OctahedronGeometry(0.8 + Math.random() * 0.55);
      else if (t === 2) geo = new THREE.TorusGeometry(0.55, 0.17, 12, 28);
      else geo = new THREE.TetrahedronGeometry(0.95 + Math.random() * 0.5);

      const mat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length], wireframe: true, transparent: true, opacity: 0.82 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 28, (Math.random() - 0.5) * 50);
      mesh.userData = { rotSpeed: 0.003 + Math.random() * 0.01, speed: 0.0018 + Math.random() * 0.007 };
      scene.add(mesh);
      shapes.push(mesh);
    }

    // ========== PARTICLES ==========
    const pCount = 800;
    const positions = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount * 3; i++) positions[i] = (Math.random() - 0.5) * 120;
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.11, transparent: true, opacity: 0.7 }));
    scene.add(particles);

    // ========== TOUCH / DRAG ROTATION ==========
    let isDragging = false;
    let previousX = 0;
    let previousY = 0;
    let rotY = 0;
    let rotX = 0.15;

    function onPointerDown(e) {
      isDragging = true;
      previousX = e.clientX || e.touches[0].clientX;
      previousY = e.clientY || e.touches[0].clientY;
    }
    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      const dx = x - previousX;
      const dy = y - previousY;
      rotY += dx * 0.005;
      rotX += dy * 0.004;
      rotX = Math.max(-0.6, Math.min(0.8, rotX));
      previousX = x;
      previousY = y;
    }
    function onPointerUp() { isDragging = false; }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // ========== SOCIAL ORBIT ==========
    const icons = document.querySelectorAll('.social-icon');
    let orbitAngle = 0;
    function updateOrbit() {
      orbitAngle += 0.007;
      icons.forEach((icon, i) => {
        const a = orbitAngle + (i * (Math.PI * 2 / icons.length));
        const x = Math.cos(a) * 105;
        const y = Math.sin(a) * 70;
        icon.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    // ========== ENTER THE GRID (Camera Dive) ==========
    let isInGrid = false;
    let targetCamZ = 32;
    let targetCamY = 6;

    document.getElementById('enterBtn').addEventListener('click', () => {
      if (isInGrid) return;
      isInGrid = true;
      ui.classList.add('hidden');
      targetCamZ = 14;
      targetCamY = 1.8;
      // intensify bloom slightly
      bloomPass.strength = 1.9;
    });

    // ========== ANIMATION ==========
    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera transition
      camera.position.z += (targetCamZ - camera.position.z) * 0.035;
      camera.position.y += (targetCamY - camera.position.y) * 0.035;

      // Apply drag rotation
      camera.position.x = Math.sin(rotY) * camera.position.z * 0.3;
      camera.position.z = Math.cos(rotY) * Math.abs(camera.position.z);
      camera.lookAt(0, isInGrid ? 0 : 2, 0);

      shapes.forEach(s => {
        s.rotation.x += s.userData.rotSpeed;
        s.rotation.y += s.userData.rotSpeed * 0.55;
        s.position.y += Math.sin(Date.now() * s.userData.speed) * 0.005;
      });
      particles.rotation.y += 0.0005;
      grid.rotation.y += 0.00025;

      updateOrbit();
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
