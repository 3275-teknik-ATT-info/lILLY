<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>lILLY — Neon Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: #e0f7ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 20;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #00f0ff, #ff00aa, #7000ff, #00f0ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 50px rgba(0, 240, 255, 0.45);
      margin-bottom: 0.6rem;
      animation: gradientShift 6s ease infinite, glow 3s ease-in-out infinite alternate;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #a0d8ff;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.6rem;
      opacity: 0.85;
    }
    p {
      font-size: 1.1rem;
      color: #b8e4ff;
      max-width: 460px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 3rem;
    }

    /* Main interactive button */
    .btn {
      pointer-events: auto;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.8rem;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.1em;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.08);
      transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
      z-index: 30;
    }
    .btn:hover, .btn:active {
      background: #00f0ff;
      color: #050510;
      transform: scale(1.08);
      box-shadow: 0 0 55px rgba(0, 240, 255, 0.9);
    }

    /* Orbiting social icons */
    .social-orbit {
      position: absolute;
      width: 280px;
      height: 280px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
    }
    .social-icon {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
      pointer-events: auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.5);
      background: rgba(10, 15, 30, 0.85);
      border: 1.5px solid #00f0ff;
      backdrop-filter: blur(4px);
    }
    .social-icon:hover {
      transform: scale(1.25);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.9);
      border-color: #ff00aa;
    }
    .social-icon.linkedin { color: #0a66c2; border-color: #0a66c2; }
    .social-icon.instagram { color: #e1306c; border-color: #e1306c; }
    .social-icon.paypal { color: #003087; border-color: #0070ba; }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.13) 2px,
        rgba(0,0,0,0.13) 4px
      );
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="content">
    <h1>lILLY</h1>
    <div class="subtitle">Neon Horizon</div>
    <p>Astro-inspired retro experience powered by Three.js.<br>Built on Android with GitHub Actions.</p>

    <div class="social-orbit" id="socialOrbit">
      <a href="https://www.linkedin.com" target="_blank" rel="noopener" class="social-icon linkedin" title="LinkedIn">in</a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener" class="social-icon instagram" title="Instagram">ig</a>
      <a href="https://www.paypal.com" target="_blank" rel="noopener" class="social-icon paypal" title="PayPal">$</a>
    </div>

    <a href="#" class="btn" id="enterBtn">ENTER THE GRID</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ========== THREE.JS SCENE ==========
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 32;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.55, 0.4, 0.85
    );
    composer.addPass(bloomPass);

    // Grid
    const grid = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1a0033);
    grid.position.y = -10;
    scene.add(grid);

    // Floating shapes
    const shapes = [];
    const colors = [0x00f0ff, 0xff00aa, 0x7000ff, 0x00ff88, 0xff55ff];
    for (let i = 0; i < 20; i++) {
      let geo;
      const t = i % 4;
      if (t === 0) geo = new THREE.IcosahedronGeometry(0.8 + Math.random()*0.6, 0);
      else if (t === 1) geo = new THREE.OctahedronGeometry(0.7 + Math.random()*0.5);
      else if (t === 2) geo = new THREE.TorusGeometry(0.5, 0.16, 10, 24);
      else geo = new THREE.TetrahedronGeometry(0.85 + Math.random()*0.45);

      const mat = new THREE.MeshBasicMaterial({
        color: colors[i % colors.length],
        wireframe: true,
        transparent: true,
        opacity: 0.8
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((Math.random()-0.5)*50, (Math.random()-0.5)*24, (Math.random()-0.5)*40);
      mesh.userData = { rotSpeed: 0.004 + Math.random()*0.01, speed: 0.002 + Math.random()*0.008 };
      scene.add(mesh);
      shapes.push(mesh);
    }

    // Background particles
    const pCount = 650;
    const positions = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount * 3; i++) positions[i] = (Math.random() - 0.5) * 100;
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: 0x00f0ff, size: 0.1, transparent: true, opacity: 0.7
    }));
    scene.add(particles);

    // ========== SOCIAL ORBIT LOGIC ==========
    const icons = document.querySelectorAll('.social-icon');
    const orbitRadius = 110;
    let angle = 0;

    function updateOrbit() {
      angle += 0.008;
      icons.forEach((icon, i) => {
        const a = angle + (i * (Math.PI * 2 / icons.length));
        const x = Math.cos(a) * orbitRadius;
        const y = Math.sin(a) * orbitRadius * 0.65; // slight ellipse
        icon.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    // ========== ANIMATION LOOP ==========
    function animate() {
      requestAnimationFrame(animate);

      shapes.forEach(s => {
        s.rotation.x += s.userData.rotSpeed;
        s.rotation.y += s.userData.rotSpeed * 0.6;
        s.position.y += Math.sin(Date.now() * s.userData.speed) * 0.006;
      });
      particles.rotation.y += 0.0006;
      grid.rotation.y += 0.0003;
      camera.position.x = Math.sin(Date.now() * 0.0002) * 3.5;
      camera.lookAt(0, 0, 0);

      updateOrbit();
      composer.render();
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // Button interaction feedback
    const btn = document.getElementById('enterBtn');
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      btn.style.transform = 'scale(0.95)';
      setTimeout(() => btn.style.transform = '', 150);
      // You can add more logic here later (e.g. expand scene)
    });
  </script>
</body>
</html>
