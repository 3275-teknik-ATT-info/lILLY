<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lILLY — Neon Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: #e0f7ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 0; }
    .content {
      position: relative; z-index: 10;
      height: 100%; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 2rem; pointer-events: none;
    }
    h1 {
      font-size: clamp(3rem, 9vw, 6rem); font-weight: 800; letter-spacing: -0.04em;
      background: linear-gradient(90deg, #00f0ff, #ff00aa, #7000ff, #00f0ff);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 50px rgba(0, 240, 255, 0.45);
      margin-bottom: 0.8rem;
      animation: gradientShift 6s ease infinite, glow 3s ease-in-out infinite alternate;
    }
    .subtitle {
      font-size: 1.15rem; color: #a0d8ff; letter-spacing: 0.18em;
      text-transform: uppercase; margin-bottom: 1.4rem; opacity: 0.85;
    }
    p {
      font-size: 1.05rem; color: #b8e4ff; max-width: 480px;
      line-height: 1.6; opacity: 0.9; margin-bottom: 1.8rem;
    }
    .controls {
      pointer-events: auto; display: flex; gap: 1rem;
      flex-wrap: wrap; justify-content: center; align-items: center;
    }
    select, .btn {
      pointer-events: auto; appearance: none;
      padding: 0.85rem 1.6rem; border: 2px solid #00f0ff;
      color: #00f0ff; background: rgba(0, 240, 255, 0.07);
      font-weight: 600; letter-spacing: 0.06em; border-radius: 3px;
      font-size: 0.95rem; cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      transition: all 0.25s ease;
    }
    select:hover, .btn:hover, select:focus {
      background: #00f0ff; color: #050510;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.75);
      outline: none;
    }
    .btn { text-decoration: none; }
    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body::after {
      content: ""; position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.13) 2px, rgba(0,0,0,0.13) 4px
      );
      pointer-events: none; z-index: 5;
    }
    /* POV field growth indicator */
    #pov-ring {
      position: fixed; top: 50%; left: 50%;
      width: 12vmin; height: 12vmin;
      border: 1.5px solid rgba(0, 240, 255, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none; z-index: 8;
      opacity: 0; transition: none;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="pov-ring"></div>

  <div class="content">
    <h1>lILLY</h1>
    <div class="subtitle">Neon Horizon</div>
    <p>Cockpit POV approach · 5 s journey · planetoids screen-pinned<br>
       Hubble Ultra Deep Field + vector grid</p>
    <div class="controls">
      <select id="planet-select" aria-label="Select destination">
        <option value="">SELECT TARGET</option>
        <option value="earth">Earth</option>
        <option value="mars">Mars</option>
        <option value="jupiter">Jupiter</option>
        <option value="neptune">Neptune</option>
        <option value="neon">Neon Core</option>
      </select>
      <a href="#" class="btn" id="enter-btn">ENTER THE GRID</a>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const container = document.getElementById('canvas-container');
    const povRing = document.getElementById('pov-ring');
    const select = document.getElementById('planet-select');
    const enterBtn = document.getElementById('enter-btn');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.0018);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 4, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Bloom
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), 1.35, 0.4, 0.82
    );
    composer.addPass(bloomPass);

    // ——— Hubble Ultra Deep Field background (public domain NASA/ESA) ———
    const texLoader = new THREE.TextureLoader();
    texLoader.load(
      'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Hubble_ultra_deep_field.jpg/2560px-Hubble_ultra_deep_field.jpg',
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        scene.background = tex;
      },
      undefined,
      () => { scene.background = new THREE.Color(0x020208); } // fallback
    );

    // Grid foundation
    const grid = new THREE.GridHelper(240, 48, 0x00f0ff, 0x002233);
    grid.position.y = -12;
    scene.add(grid);

    // Particles
    const pCount = 900;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 180;
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: 0x00f0ff, size: 0.32, transparent: true, opacity: 0.65
    }));
    scene.add(points);

    // ——— Screen-pinned planetoids (fixed NDC positions) ———
    const pinData = [
      { ndc: new THREE.Vector2(-0.78,  0.55), color: 0x44ffaa, r: 0.9 },
      { ndc: new THREE.Vector2( 0.82,  0.42), color: 0xff66aa, r: 1.1 },
      { ndc: new THREE.Vector2(-0.65, -0.62), color: 0x66aaff, r: 0.75 },
      { ndc: new THREE.Vector2( 0.70, -0.48), color: 0xffaa44, r: 0.85 },
      { ndc: new THREE.Vector2( 0.05,  0.78), color: 0xaa66ff, r: 0.7 }
    ];
    const pinned = [];
    pinData.forEach(d => {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(d.r, 24, 24),
        new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.85 })
      );
      mesh.userData.ndc = d.ndc;
      scene.add(mesh);
      pinned.push(mesh);
    });

    function updatePinned() {
      const v = new THREE.Vector3();
      pinned.forEach(m => {
        v.set(m.userData.ndc.x, m.userData.ndc.y, 0.92);
        v.unproject(camera);
        m.position.copy(v);
      });
    }

    // ——— Approachable destination planet ———
    const destColors = {
      earth: 0x4488ff, mars: 0xff6633, jupiter: 0xffaa55,
      neptune: 0x3366ff, neon: 0x00f0ff
    };
    let destPlanet = null;
    let journey = null; // { start, duration, fromZ, toZ, fromScale, toScale }

    function clearDest() {
      if (destPlanet) {
        scene.remove(destPlanet);
        destPlanet.geometry.dispose();
        destPlanet.material.dispose();
        destPlanet = null;
      }
      journey = null;
      povRing.style.opacity = '0';
      povRing.style.transform = 'translate(-50%, -50%) scale(1)';
    }

    function startJourney(key) {
      clearDest();
      if (!key) return;

      const mat = new THREE.MeshBasicMaterial({
        color: destColors[key] || 0x00f0ff,
        transparent: true, opacity: 0.92
      });
      destPlanet = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 48), mat);
      destPlanet.position.set(0, 2, -80);
      destPlanet.scale.setScalar(4);
      scene.add(destPlanet);

      // 5-second single-event approach (cockpit POV growth)
      journey = {
        start: performance.now(),
        duration: 5000,
        fromZ: -80,
        toZ: 18,
        fromScale: 4,
        toScale: 28
      };
      povRing.style.opacity = '0.7';
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    select.addEventListener('change', (e) => startJourney(e.target.value));
    enterBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (journey) { clearDest(); select.value = ''; }
      else if (select.value) startJourney(select.value);
    });

    // Animate
    function animate(now) {
      requestAnimationFrame(animate);

      points.rotation.y += 0.0007;
      grid.rotation.y += 0.00025;
      pinned.forEach(m => { m.rotation.y += 0.008; });

      if (journey && destPlanet) {
        const t = Math.min(1, (now - journey.start) / journey.duration);
        const e = easeInOutCubic(t);
        destPlanet.position.z = journey.fromZ + (journey.toZ - journey.fromZ) * e;
        const s = journey.fromScale + (journey.toScale - journey.fromScale) * e;
        destPlanet.scale.setScalar(s);

        // POV field visual growth
        const scale = 1 + e * 9;
        povRing.style.transform = `translate(-50%, -50%) scale(${scale})`;
        povRing.style.opacity = String(0.75 * (1 - e * 0.85));

        if (t >= 1) {
          // Auto-terminate: single event complete
          clearDest();
          select.value = '';
        }
      }

      updatePinned(); // keep planetoids screen-pinned even while grid levels
      composer.render();
    }
    animate(performance.now());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
